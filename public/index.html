<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Munich Monks RFC</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monks">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --y:#ffcc00; --k:#000; --w:#fff;
  --bg:#0a0a0a; --s1:#141414; --s2:#1d1d1d; --s3:#262626; --line:#2b2b2b;
  --tx:#f4f4f4; --mut:#a1a1a1; --acc:#ffcc00; --on-acc:#000;
  --rainbow:conic-gradient(from 0deg,#ff0000,#ff7a00,#ffe600,#7dff00,#00ff8c,#00e1ff,#0057ff,#8000ff,#ff00d4,#ff0000);
  --rainbow-lin:linear-gradient(90deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff2d92);
  --c-training:#ffcc00; --c-spiel:#ff6b5b; --c-turnier:#5ac8ff; --c-social:#c79bff;
  --radius:18px;
  --head:"Barlow Condensed",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme=light]{
  --bg:#f3f2ec; --s1:#ffffff; --s2:#f1f0e9; --s3:#e6e5dc; --line:#dedcd2;
  --tx:#111; --mut:#5b5b5b; --acc:#8a6a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--head);letter-spacing:.01em;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:12px;height:62px}
.appbar img{width:42px;height:42px;border-radius:50%;display:block}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--head);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.brand span{font-size:12px;color:var(--mut)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.jersey-strip{height:6px;background:linear-gradient(var(--y) 0 50%,#fff 50% 100%)}

/* ---------- Tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--s1) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;border:0;background:none;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:600}
.tab svg{width:25px;height:25px;transition:transform .2s}
.tab[aria-selected=true]{color:var(--tx)}
.tab[aria-selected=true] svg{color:var(--y);transform:translateY(-1px)}
[data-theme=light] .tab[aria-selected=true] svg{color:#000}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--rainbow-lin)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
section[hidden]{display:none}

/* ---------- Jersey-Hero ---------- */
.hero{border-radius:var(--radius);overflow:hidden;margin:16px 0 14px;border:1px solid var(--line)}
.hero .top{background:var(--y);color:#000;padding:16px 18px 12px}
.hero .top small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;opacity:.75}
.hero .top h1,.hero .top h2{font-size:32px;font-weight:800;line-height:1.02;text-transform:uppercase}
.hero .stripe{height:12px;background:#fff}
.hero .body{background:#000;color:#fff;padding:14px 18px 16px}
.hero .body p{margin:0;color:#d6d6d6;font-size:14.5px}

/* ---------- Chips / Buttons ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:0 14px;height:38px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--y);color:#000;border-color:var(--y)}
.filter-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:6px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-weight:600;font-size:15px;text-decoration:none;color:var(--tx)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--y);border-color:var(--y);color:#000}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:11px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Termine ---------- */
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:4px 0 10px}
.status .led{width:8px;height:8px;border-radius:50%;background:#34c759;flex:none}
.status .led.warn{background:#ff9f0a}
.status .led.demo{background:var(--rainbow)}
.status button{margin-left:auto;border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:8px 0}
.next .top{display:flex;gap:12px;align-items:flex-start}
.next .top .ticon{width:44px;height:44px;border-radius:12px;background:#000;color:var(--y);display:grid;place-items:center;flex:none}
.next .top .ticon svg{width:24px;height:24px}
.next .top h2{font-size:28px}
.countdown{display:flex;gap:8px;margin:2px 0 12px}
.countdown div{flex:1;background:#151515;border:1px solid #2a2a2a;border-radius:12px;text-align:center;padding:8px 0 6px}
.countdown b{display:block;font-family:var(--head);font-size:34px;font-weight:800;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.countdown span{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.06em}
.live-now{display:inline-flex;align-items:center;gap:8px;background:#151515;border:1px solid #333;border-radius:999px;padding:6px 12px;font-weight:700;margin-bottom:12px}
.live-now::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.meta{display:grid;gap:6px;font-size:14.5px;margin-bottom:14px}
.meta div{display:flex;gap:9px;align-items:flex-start}
.meta svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--y)}
.next .btnrow{display:grid;grid-template-columns:1fr 1fr 1fr}
.next .btnrow .btn{padding:0 8px;font-size:14px}
.next .btn{background:#1d1d1d;border-color:#333;color:#fff}
.next .btn.primary{background:var(--y);color:#000;border-color:var(--y)}

.week{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.week h3{font-size:21px;font-weight:800;text-transform:uppercase}
.week span{font-size:13px;color:var(--mut)}
.ev{display:block;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;position:relative}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc)}
.ev summary{list-style:none;display:flex;gap:12px;padding:12px 14px 12px 17px;cursor:pointer;align-items:center;min-height:72px}
.ev summary::-webkit-details-marker{display:none}
.date{width:50px;flex:none;text-align:center;border-radius:12px;background:var(--s2);padding:6px 0 5px}
.date small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut)}
.date b{display:block;font-family:var(--head);font-weight:800;font-size:26px;line-height:1}
.ev .info{flex:1;min-width:0}
.ev .title{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.ev .sub{font-size:13.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--s2);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.tag svg{width:13px;height:13px;color:var(--tc)}
.tag.cancel{background:#ff3b30;color:#fff;border-color:#ff3b30}
.ev.cancelled .title{text-decoration:line-through;opacity:.7}
.chev{width:20px;height:20px;color:var(--mut);transition:transform .2s;flex:none}
.ev[open] .chev{transform:rotate(180deg)}
.ev .more{padding:0 16px 16px 17px;border-top:1px solid var(--line)}
.ev .more .meta{margin:12px 0}
.desc{white-space:pre-wrap;font-size:14px;color:var(--tx);background:var(--s2);border-radius:12px;padding:10px 12px;margin:0 0 12px;overflow-wrap:anywhere}

.empty{background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0}
.empty h3{font-size:22px;text-transform:uppercase;margin-bottom:6px}
.empty p{margin:0 0 12px;color:var(--mut);font-size:14.5px}
.empty textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:10px;font:13px ui-monospace,monospace;margin:8px 0}
.note{font-size:13px;color:var(--mut);background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:12px}
.demo-banner{background:var(--rainbow-lin);color:#000;font-weight:700;font-size:13px;border-radius:12px;padding:9px 12px;margin:10px 0;text-align:center}

/* ---------- Loader ---------- */
.loader{display:grid;place-items:center;gap:14px;padding:60px 0;color:var(--mut);font-size:14px}
.ring{width:52px;height:52px;border-radius:50%;background:var(--rainbow);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Sheet / Toast ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--s1);border-radius:24px 24px 0 0;border:1px solid var(--line);max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.sheet:not(.open){visibility:hidden;transition:transform .28s,visibility 0s .28s}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--s3);margin:10px auto 4px}
.sheet .inner{padding:6px 18px 8px}
.sheet .close{position:absolute;right:12px;top:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--y);color:#000;font-weight:700;padding:10px 16px;border-radius:999px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- Karten allgemein ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.cardh{font-size:24px;text-transform:uppercase;font-weight:800;margin-bottom:4px}
.mut{color:var(--mut);font-size:14px;margin:0 0 10px}
h4{font-family:var(--head);font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px;color:var(--acc)}
.mini{margin:0;padding-left:18px;font-size:14.5px}.mini li{margin:3px 0}
.mini.check{list-style:none;padding-left:0}.mini.check li{padding-left:24px;position:relative}.mini.check li::before{content:"✓";position:absolute;left:2px;color:var(--acc);font-weight:800}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}
.seg button{border:0;background:none;border-radius:10px;min-height:42px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--y);color:#000}
.seg.big button{min-height:48px;font-size:15.5px}
.gbox{background:var(--s2);border-radius:14px;padding:12px;margin-bottom:12px}.gbox p{font-size:13.5px;color:var(--mut);margin:4px 0 10px}

/* ---------- Team ---------- */
.ava{flex:none;border-radius:16px;background:var(--s2);object-fit:cover;display:block}
.avawrap{position:relative;flex:none;align-self:flex-start}
.photobtn{position:absolute;right:-6px;bottom:-6px;width:34px;height:34px;border-radius:50%;border:2px solid var(--bg);background:var(--y);font-size:16px;display:grid;place-items:center;padding:0}
.editbar .btn{white-space:nowrap;flex:none}
.editbar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi);border-radius:20px;padding:8px 8px 8px 14px;margin:0 0 12px;font-size:13.5px;color:var(--mut)}
.photoprev{position:relative;width:180px;height:180px;margin:10px auto 0;border-radius:24px;overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.photoprev canvas{width:100%;height:100%;display:block}
#phEmpty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:14px}
.person{display:flex;gap:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.pinfo{flex:1;min-width:0}
.prole{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--acc)}
.person h3,.confidant h3{font-family:var(--body);font-size:17px;font-weight:700;margin:2px 0 4px}
.ph{color:var(--mut);font-style:italic;font-weight:600!important}
.pron{font-size:12.5px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:4px;font-style:normal;vertical-align:2px}
.ask{font-size:14px;margin:0 0 10px;color:var(--tx)}.ask b{color:var(--mut);font-weight:600}
.nocontact{font-size:13px;color:var(--mut)}
.confidant{position:relative;border-radius:var(--radius);padding:16px;margin:0 0 14px;background:linear-gradient(var(--s1),var(--s1)) padding-box,var(--rainbow-lin) border-box;border:2.5px solid transparent}
.confidant .conf-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.confidant p{font-size:14.5px;margin:0 0 8px}
.clubbox{text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:18px 0}
.clubbox h3{font-size:24px;text-transform:uppercase}.clubbox p{color:var(--mut);font-size:14px;margin:4px 0 12px}

/* ---------- Positionen ---------- */
.grpinfo{font-size:14.5px;background:var(--s1);border:1px solid var(--line);border-left:5px solid var(--y);border-radius:14px;padding:10px 12px;margin-bottom:10px;min-height:48px}
.fieldwrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.field{display:block;width:100%;height:auto;touch-action:manipulation}
.pl{cursor:pointer;transition:opacity .25s}.pl:focus{outline:none}
.pl .sel{opacity:0;transition:opacity .2s}.pl.active .sel,.pl:focus-visible .sel{opacity:1}
.pl.dim{opacity:.18}
.pl:not(.dim) > g{filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.scrum{display:block;width:100%;height:auto;border-radius:14px;background:#123320}
.scrum text{font-family:var(--head);font-weight:800;font-size:14px;text-anchor:middle}
.scrum .opp circle{fill:#555;opacity:.6}.scrum .opp text{fill:#ddd}
.scrum .sp{cursor:pointer}
.scrum .cap{font-family:var(--body);font-weight:600;font-size:11.5px;fill:#fff;fill-opacity:.8;text-anchor:start}
.scrumtext{font-size:14.5px;margin:0 0 6px;min-height:44px}
.poshead{display:flex;gap:14px;align-items:center;margin:4px 40px 6px 0}
.posj{width:84px;height:88px;flex:none}
.poshead h2{font-size:30px;font-weight:800;text-transform:uppercase;line-height:1}
.poshead .de{color:var(--mut);font-size:15px;margin-top:2px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
@media (max-width:420px){.twocol{grid-template-columns:1fr}}
.box{background:var(--s2);border-radius:14px;padding:10px 12px}.box h4{margin:0 0 4px;font-size:15px}.box p{margin:0;font-size:14px}
.fit{background:var(--y);color:#000;border-radius:14px;padding:12px 14px;margin:16px 0 12px;font-size:15px}
.posnav{display:flex;justify-content:space-between;gap:8px}

/* ---------- Calls ---------- */
.basics{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin:6px 0 10px}
.basics summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center}
.basics p{font-size:14px;margin:0 0 10px}
.callpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.callpick button{text-align:left;border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:10px 12px;min-height:64px}
.callpick b{display:block;font-family:var(--head);font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.05}
.callpick span{display:block;font-size:12.5px;color:var(--mut);line-height:1.3;margin-top:2px}
.callpick button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#000}.callpick button[aria-pressed=true] span{color:#333}
.callcard{padding:14px}
.callhead{margin-bottom:10px}
.callname{font-family:var(--head);font-size:34px;font-weight:800;text-transform:uppercase;line-height:1}
.anim{display:block;width:100%;height:auto;border-radius:14px;background:#123320}
.anim .ent text{font-family:var(--head);font-weight:800;font-size:10px}
.anim .flab{font-family:var(--head);font-weight:700;font-size:11px;fill:#fff;fill-opacity:.65}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin:8px 2px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid #000}
.lg.j{background:#ffcc00}.lg.l{background:#fff}.lg.h{background:#000;border-color:#ffcc00}.lg.b{background:#000;border-color:#fff}.lg.o{background:#6b6b6b;border-color:#3a3a3a}.lg.s{background:transparent;border:2px dashed #ffcc00}
.caption{background:var(--s2);border-radius:12px;padding:10px 12px;font-size:14.5px;min-height:64px;display:flex;gap:10px;align-items:flex-start}
.caption .sn{flex:none;background:var(--y);color:#000;font-weight:800;font-size:12px;border-radius:8px;padding:2px 7px;margin-top:1px}
.ctrls{display:flex;justify-content:center;gap:12px;margin:12px 0 6px}
.cbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;font-size:16px}
.cbtn svg{width:22px;height:22px}
.cbtn.main{width:60px;height:60px;background:var(--y);border-color:var(--y);color:#000}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--s3);cursor:pointer}
.dots i.on{background:var(--y);opacity:.55}.dots i.cur{opacity:1}
.expl{font-size:14.5px;margin:12px 0 0}
.who{display:grid;gap:6px}.who div{background:var(--s2);border-radius:12px;padding:8px 12px;font-size:14px}.who b{display:block;font-size:13px;color:var(--acc)}
.quizbar{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:4px 2px}.quizbar b{color:var(--tx)}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ans{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-family:var(--head);font-weight:800;font-size:22px;text-transform:uppercase}
.ans.right{background:#34c759;border-color:#34c759;color:#000}.ans.wrong{background:#ff3b30;border-color:#ff3b30;color:#fff}
.ans:disabled{cursor:default}
.qfb{margin-top:12px}.qfb p{font-size:15px;margin:0 0 10px}
.wip{text-align:center;color:var(--mut);padding:40px 10px}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin:30px 0 10px}

/* =================== LIQUID GLASS =================== */
:root{
  --bg:#050505; --s1:#161618; --s2:rgba(255,255,255,.065); --s3:rgba(255,255,255,.13); --line:rgba(255,255,255,.09);
  --card:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  --card-brd:rgba(255,255,255,.10); --card-hi:rgba(255,255,255,.10);
  --glass:rgba(28,28,30,.55); --glass-strong:rgba(22,22,24,.80); --glass-brd:rgba(255,255,255,.16); --glass-hi:rgba(255,255,255,.28);
  --gold:linear-gradient(180deg,#ffe066 0%,#ffcc00 55%,#f0bf00 100%);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
[data-theme=light]{
  --bg:#ecebe6; --s1:#fbfbf8; --s2:rgba(0,0,0,.045); --s3:rgba(0,0,0,.09); --line:rgba(0,0,0,.08);
  --card:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.62));
  --card-brd:rgba(255,255,255,.9); --card-hi:rgba(255,255,255,1);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(250,250,248,.86); --glass-brd:rgba(255,255,255,.85); --glass-hi:rgba(255,255,255,1);
}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 30% at 12% 6%,rgba(255,204,0,.24),transparent 70%),
    radial-gradient(36% 28% at 92% 30%,rgba(255,255,255,.07),transparent 70%),
    radial-gradient(44% 34% at 78% 98%,rgba(255,204,0,.13),transparent 70%),
    radial-gradient(30% 24% at 6% 78%,rgba(150,90,255,.09),transparent 70%)}
[data-theme=light] body::before{background:radial-gradient(42% 30% at 12% 6%,rgba(255,204,0,.35),transparent 70%),radial-gradient(44% 34% at 80% 96%,rgba(255,204,0,.2),transparent 70%),radial-gradient(30% 24% at 6% 78%,rgba(150,90,255,.08),transparent 70%)}

/* Glas-Chrom: Header, Tabbar, Sheet, Toast */
.appbar{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:8px 10px 0}
.appbar .wrap,.tabbar nav,.toast{background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 34px rgba(0,0,0,.38)}
[data-theme=light] .appbar .wrap,[data-theme=light] .tabbar nav,[data-theme=light] .toast{box-shadow:inset 0 1px 0 var(--glass-hi),0 10px 30px rgba(0,0,0,.10)}
.appbar .wrap{height:60px;border-radius:24px;padding:0 8px 0 9px;max-width:624px}
.appbar img{box-shadow:0 2px 10px rgba(0,0,0,.35)}
.jersey-strip{display:none}
.iconbtn{border-radius:50%;background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi)}
.tabbar{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.tabbar nav{max-width:520px;border-radius:32px;padding:6px;gap:2px}
.tab{height:56px;border-radius:26px;transition:background .25s,color .25s}
.tab[aria-selected=true]{background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 1px rgba(255,255,255,.06)}
[data-theme=light] .tab[aria-selected=true]{background:rgba(0,0,0,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.tab[aria-selected=true]::before{top:auto;bottom:5px;width:14px;height:3px;border-radius:2px}
main.wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.sheet-bg{background:rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));border-radius:34px;max-height:calc(100dvh - 90px);
  background:var(--glass-strong);backdrop-filter:blur(34px) saturate(190%);-webkit-backdrop-filter:blur(34px) saturate(190%);
  border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 20px 60px rgba(0,0,0,.5);padding-bottom:28px}
.sheet:not(.open){transform:translateY(calc(100% + 30px))}
.sheet .close{border-radius:50%}
.toast{color:var(--tx);bottom:calc(104px + env(safe-area-inset-bottom))}

/* Karten aus Glas */
.card,.ev,.person,.empty,.grpinfo,.basics,.clubbox,.callpick button,.box,.who div,.caption,.note,.gbox,.desc,.seg,.quizbar{
  background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi),0 6px 22px rgba(0,0,0,.18)}
[data-theme=light] .card,[data-theme=light] .ev,[data-theme=light] .person,[data-theme=light] .empty,[data-theme=light] .grpinfo,[data-theme=light] .basics,[data-theme=light] .clubbox,[data-theme=light] .callpick button{box-shadow:inset 0 1px 0 var(--card-hi),0 6px 20px rgba(0,0,0,.06)}
.box,.who div,.caption,.note,.gbox,.desc,.seg{box-shadow:inset 0 1px 0 var(--card-hi)}
.quizbar{border-radius:18px;padding:10px 14px}
.card,.person,.empty,.clubbox{border-radius:26px}
.ev{border-radius:22px}
.ev::before{top:14px;bottom:14px;left:6px;width:4px;border-radius:3px}
.ev summary{padding-left:20px}
.date{background:var(--s2);border-radius:14px;box-shadow:inset 0 1px 0 var(--card-hi)}
.grpinfo{border-left:1px solid var(--card-brd);border-radius:20px;position:relative;padding-left:26px}
.grpinfo::before{content:"";position:absolute;left:12px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--y);box-shadow:0 0 10px var(--y)}
.basics,.callpick button{border-radius:20px}
.chip{background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi)}
.btn{background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi);border-radius:16px}
.btn.ghost{background:transparent;box-shadow:none}
.cbtn{background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi),0 4px 14px rgba(0,0,0,.2)}
.ans{background:var(--card);border:1px solid var(--card-brd);box-shadow:inset 0 1px 0 var(--card-hi);border-radius:18px}
.seg{border-radius:18px}.seg button{border-radius:14px}
/* Gelbe Akzente mit Glanz */
.btn.primary,.chip[aria-pressed=true],.seg button[aria-pressed=true],.cbtn.main,.callpick button[aria-pressed=true],.fit,.photobtn,.caption .sn{
  background:var(--gold);color:#000;border-color:rgba(255,230,120,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(0,0,0,.08),0 6px 18px rgba(255,204,0,.22)}
.fit{border-radius:20px}
/* Jersey-Heros: abgerundeter, mit Glanz */
.hero{border-radius:30px;border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 40px rgba(0,0,0,.4)}
[data-theme=light] .hero{box-shadow:0 14px 34px rgba(0,0,0,.14);border-color:rgba(0,0,0,.06)}
.hero .top{background:var(--gold);position:relative}
.hero .top::after{content:"";position:absolute;inset:0 0 auto 0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);pointer-events:none}
.hero .top > *{position:relative;z-index:1}
.next .top .ticon{border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.countdown div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.next .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.next .btn.primary{background:var(--gold);color:#000}
.confidant{border-radius:28px;box-shadow:0 10px 34px rgba(0,0,0,.3)}
.ava{border-radius:20px;box-shadow:inset 0 1px 0 var(--card-hi)}
.fieldwrap,.anim,.scrum{border-radius:24px}
.fieldwrap{border:1px solid var(--card-brd);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.photobtn{border:2px solid var(--bg)}
.foot{margin-bottom:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
