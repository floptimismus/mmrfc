<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --y:#ffcc00; --k:#000; --w:#fff;
  --bg:#0a0a0a; --s1:#141414; --s2:#1d1d1d; --s3:#262626; --line:#2b2b2b;
  --tx:#f4f4f4; --mut:#a1a1a1; --acc:#ffcc00; --on-acc:#000;
  --rainbow:conic-gradient(from 0deg,#ff0000,#ff7a00,#ffe600,#7dff00,#00ff8c,#00e1ff,#0057ff,#8000ff,#ff00d4,#ff0000);
  --rainbow-lin:linear-gradient(90deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff2d92);
  --c-training:#ffcc00; --c-spiel:#ff6b5b; --c-turnier:#5ac8ff; --c-social:#c79bff;
  --radius:18px;
  --head:"Barlow Condensed",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
[data-theme=light]{
  --bg:#f3f2ec; --s1:#ffffff; --s2:#f1f0e9; --s3:#e6e5dc; --line:#dedcd2;
  --tx:#111; --mut:#5b5b5b; --acc:#8a6a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--head);letter-spacing:.01em;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Header ---------- */
.appbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:12px;height:62px}
.appbar img{width:42px;height:42px;border-radius:50%;display:block}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--head);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;letter-spacing:.03em}
.brand span{font-size:12px;color:var(--mut)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.jersey-strip{height:6px;background:linear-gradient(var(--y) 0 50%,#fff 50% 100%)}

/* ---------- Tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--s1) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;border:0;background:none;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:600}
.tab svg{width:25px;height:25px;transition:transform .2s}
.tab[aria-selected=true]{color:var(--tx)}
.tab[aria-selected=true] svg{color:var(--y);transform:translateY(-1px)}
[data-theme=light] .tab[aria-selected=true] svg{color:#000}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--rainbow-lin)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
section[hidden]{display:none}

/* ---------- Jersey-Hero ---------- */
.hero{border-radius:var(--radius);overflow:hidden;margin:16px 0 14px;border:1px solid var(--line)}
.hero .top{background:var(--y);color:#000;padding:16px 18px 12px}
.hero .top small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;opacity:.75}
.hero .top h1,.hero .top h2{font-size:32px;font-weight:800;line-height:1.02;text-transform:uppercase}
.hero .stripe{height:12px;background:#fff}
.hero .body{background:#000;color:#fff;padding:14px 18px 16px}
.hero .body p{margin:0;color:#d6d6d6;font-size:14.5px}

/* ---------- Chips / Buttons ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:0 14px;height:38px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--y);color:#000;border-color:var(--y)}
.filter-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:6px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--s2);font-weight:600;font-size:15px;text-decoration:none;color:var(--tx)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--y);border-color:var(--y);color:#000}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:11px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Termine ---------- */
.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:4px 0 10px}
.status .led{width:8px;height:8px;border-radius:50%;background:#34c759;flex:none}
.status .led.warn{background:#ff9f0a}
.status .led.demo{background:var(--rainbow)}
.status button{margin-left:auto;border:0;background:none;color:var(--acc);font-weight:600;font-size:13px;padding:8px 0}
.next .top{display:flex;gap:12px;align-items:flex-start}
.next .top .ticon{width:44px;height:44px;border-radius:12px;background:#000;color:var(--y);display:grid;place-items:center;flex:none}
.next .top .ticon svg{width:24px;height:24px}
.next .top h2{font-size:28px}
.countdown{display:flex;gap:8px;margin:2px 0 12px}
.countdown div{flex:1;background:#151515;border:1px solid #2a2a2a;border-radius:12px;text-align:center;padding:8px 0 6px}
.countdown b{display:block;font-family:var(--head);font-size:34px;font-weight:800;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}
.countdown span{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.06em}
.live-now{display:inline-flex;align-items:center;gap:8px;background:#151515;border:1px solid #333;border-radius:999px;padding:6px 12px;font-weight:700;margin-bottom:12px}
.live-now::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff3b30;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.meta{display:grid;gap:6px;font-size:14.5px;margin-bottom:14px}
.meta div{display:flex;gap:9px;align-items:flex-start}
.meta svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--y)}
.next .btnrow{display:grid;grid-template-columns:1fr 1fr 1fr}
.next .btnrow .btn{padding:0 8px;font-size:14px}
.next .btn{background:#1d1d1d;border-color:#333;color:#fff}
.next .btn.primary{background:var(--y);color:#000;border-color:var(--y)}

.week{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.week h3{font-size:21px;font-weight:800;text-transform:uppercase}
.week span{font-size:13px;color:var(--mut)}
.ev{display:block;background:var(--s1);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;position:relative}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc)}
.ev summary{list-style:none;display:flex;gap:12px;padding:12px 14px 12px 17px;cursor:pointer;align-items:center;min-height:72px}
.ev summary::-webkit-details-marker{display:none}
.date{width:50px;flex:none;text-align:center;border-radius:12px;background:var(--s2);padding:6px 0 5px}
.date small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut)}
.date b{display:block;font-family:var(--head);font-weight:800;font-size:26px;line-height:1}
.ev .info{flex:1;min-width:0}
.ev .title{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.ev .sub{font-size:13.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--s2);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
.tag svg{width:13px;height:13px;color:var(--tc)}
.tag.cancel{background:#ff3b30;color:#fff;border-color:#ff3b30}
.ev.cancelled .title{text-decoration:line-through;opacity:.7}
.chev{width:20px;height:20px;color:var(--mut);transition:transform .2s;flex:none}
.ev[open] .chev{transform:rotate(180deg)}
.ev .more{padding:0 16px 16px 17px;border-top:1px solid var(--line)}
.ev .more .meta{margin:12px 0}
.desc{white-space:pre-wrap;font-size:14px;color:var(--tx);background:var(--s2);border-radius:12px;padding:10px 12px;margin:0 0 12px;overflow-wrap:anywhere}

.empty{background:var(--s1);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0}
.empty h3{font-size:22px;text-transform:uppercase;margin-bottom:6px}

async function fetchText(url, ms = 8000) {
  const ac = new AbortController(); const to = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, { cache: "no-store", signal: ac.signal }); if (!r.ok) throw new Error(r.status); return await r.text(); }
  finally { clearTimeout(to); }
}
async function loadCalendar() {
  $("#tab-termine").innerHTML = '<div class="loader"><div class="ring"></div>Termine werden geladen …</div>';
  const urls = [CONFIG.PROXY_URL, CONFIG.ICS_URL].filter(Boolean);
  for (const u of urls) {
    try { const t = await fetchText(u); if (t.includes("BEGIN:VCALENDAR")) { store.set("ics", { text: t, at: Date.now(), src: "live" }); return useICS(t, "live", Date.now()); } } catch (e) { /* CSP/CORS/Netz */ }
  }
  const cached = store.get("ics"), snapAt = Date.parse(SNAPSHOT.stand) || 0;
  if (cached && cached.text && cached.at > snapAt) useICS(cached.text, cached.src === "live" ? "cache" : cached.src, cached.at);
  else if (SNAPSHOT.events.length) useSnapshot();
  else if (EMBEDDED_ICS.trim()) useICS(EMBEDDED_ICS, "embedded", null);
  else { Cal.source = null; renderTermine(); }
  if (store.get("gcal_ok")) googleRefresh(false);
}
function useICS(text, source, at) {
  try {
    const now = Date.now();
    Cal.events = expandEvents(parseICS(text), now - 200 * 864e5, /* Vergangenes für „Ergebnis aus Termin“ */ now + CONFIG.HORIZON_DAYS * 864e5);
    Cal.source = source; Cal.at = at;
  } catch (e) { console.error(e); Cal.source = null; toast("Kalender konnte nicht gelesen werden"); }
  renderTermine();
}
function filtered() {
  const f = Cal.filter, now = Date.now();
  return Cal.events.filter(e => e.end > now || (e.end === e.start && e.start > now - 2 * 36e5))
    .filter(e => f.type === "alle" || e.type === f.type)
    .filter(e => f.team === "alle" || e.team === f.team || e.team === "alle" || e.team === "beide");
}
function sourceLine() {
  const map = {
    live: ['', "Live aus SpielerPlus · " + F.stamp.format(Cal.at)],
    google: ['', "Live aus Google Kalender · " + F.stamp.format(Cal.at)],
    snapshot: ['', "SpielerPlus-Termine · Stand " + (Cal.at ? F.stamp.format(Cal.at) : "–")],
    cache: ['warn', "Offline-Stand vom " + (Cal.at ? F.stamp.format(Cal.at) : "–")],
    import: ['warn', "Importierte Datei · Stand " + (Cal.at ? F.stamp.format(Cal.at) : "–")],
    embedded: ['warn', "Fest eingebauter Kalender-Stand"],
    demo: ['demo', "Beispieldaten – nicht echt"],
  };
  const [cls, txt] = map[Cal.source] || ['warn', ""];
  return `<div class="status"><span class="led ${cls}"></span><span>${esc(txt)}</span><button id="srcBtn">Datenquelle</button></div>`;
}
function typeChip(key, label, color) {
  return `<button class="chip" data-ft="${key}" aria-pressed="${Cal.filter.type === key}">${color ? `<span class="dot" style="background:${color}"></span>` : ""}${label}</button>`;
}
function teamChip(key, label) { return `<button class="chip" data-fteam="${key}" aria-pressed="${Cal.filter.team === key}">${label}</button>`; }
function teamTag(e) { return e.team === "flinta" ? '<span class="tag">FLINTA*</span>' : e.team === "mixed" ? '<span class="tag">Mixed</span>' : e.team === "beide" ? '<span class="tag">Mixed + FLINTA*</span>' : ""; }
function typeTag(e) { const T = TYPES[e.type]; return `<span class="tag" style="--tc:${T.color}">${T.icon}${esc(e.sub || T.label)}</span>`; }

function renderTermine() {
  clearInterval(Cal.timer);
  const root = $("#tab-termine");
  if (!Cal.source) { root.innerHTML = emptyState(); bindEmpty(); return; }
  const list = filtered();
  const next = list[0];
  let html = (Cal.source === "demo" ? '<div class="demo-banner">🌈 Vorschau mit Beispieldaten – das sind keine echten Termine</div>' : "") + sourceLine();
  html += `<div class="filter-label">Art</div><div class="chips">${typeChip("alle", "Alle")}${Object.entries(TYPES).map(([k, T]) => typeChip(k, T.plural, T.color)).join("")}</div>`;
  html += `<div class="filter-label">Team</div><div class="chips">${teamChip("alle", "Alle Teams")}${teamChip("mixed", "Mixed")}${teamChip("flinta", "FLINTA*")}</div>`;

  if (!next) {
    html += `<div class="empty"><h3>Nix los? 🤔</h3><p>Für diese Filter gibt's gerade keine kommenden Termine. Probier mal „Alle“.</p></div>`;
  } else {
    const T = TYPES[next.type], running = next.start <= Date.now();
    html += `<div class="hero next" style="--tc:${T.color}">
      <div class="top"><div class="ticon">${T.icon}</div><div style="min-width:0"><small>Nächster Termin · ${esc(T.label)}</small><h2>${esc(next.title)}</h2></div></div>
      <div class="stripe"></div>
      <div class="body">
        ${running ? '<div class="live-now">Läuft gerade</div>' : `<div class="countdown" id="cd"><div><b>–</b><span>Tage</span></div><div><b>–</b><span>Std</span></div><div><b>–</b><span>Min</span></div><div><b>–</b><span>Sek</span></div></div>`}
        <div class="meta">
          <div>${ICON.cal}<span>${esc(F.long.format(next.start))}</span></div>
          <div>${ICON.clock}<span>${esc(timeRange(next))}</span></div>
          ${next.loc ? `<div>${ICON.pin}<span>${esc(next.loc)}</span></div>` : ""}
        </div>
        ${next.cancelled ? '<p style="margin-bottom:12px"><span class="tag cancel">Abgesagt</span></p>' : ""}
        <div class="btnrow">
          ${next.loc ? `<a class="btn primary" href="${mapsLinks(next.loc).g}" target="_blank" rel="noopener">${ICON.map}Route</a>` : ""}
          <a class="btn" href="${gcalLink(next)}" target="_blank" rel="noopener">${ICON.cal}Kalender</a>
          <button class="btn" data-detail="${esc(next.id)}">Details</button>
        </div>
      </div></div>`;
    const rest = list.slice(1);
    let curWeek = null;
    const thisMon = weekInfo(Date.now()).mon;
    let shownWeeks = 0, hiddenCount = 0;
    for (const e of rest) {
      const wi = weekInfo(e.start);
      if (wi.mon !== curWeek) {
        if (shownWeeks >= Cal.weeks) { hiddenCount = rest.length - rest.indexOf(e); break; }
        shownWeeks++;
        curWeek = wi.mon;
        const diff = Math.round((wi.mon - thisMon) / (7 * 864e5));
        const name = diff === 0 ? "Diese Woche" : diff === 1 ? "Nächste Woche" : "KW " + wi.kw;
        html += `<div class="week"><h3>${name}</h3><span>${FU.dm.format(wi.mon)} – ${FU.dm.format(wi.mon + 6 * 864e5)}</span></div>`;
      }
      html += eventCard(e);
    }
    if (hiddenCount) html += `<div style="text-align:center;margin:16px 0"><button class="btn" id="moreBtn">Weitere ${hiddenCount} Termine anzeigen</button></div>`;
    if (!rest.length) html += '<p class="foot">Danach ist (noch) nichts eingetragen.</p>';
  }
  html += `<p class="foot">Alle Zeiten in deutscher Zeit (Europe/Berlin).</p>`;
  root.innerHTML = html;

  $$("[data-ft]", root).forEach(b => b.onclick = () => { Cal.filter.type = b.dataset.ft; store.set("filter", Cal.filter); renderTermine(); });
  $$("[data-fteam]", root).forEach(b => b.onclick = () => { Cal.filter.team = b.dataset.fteam; store.set("filter", Cal.filter); renderTermine(); });
  $$("[data-copy]", root).forEach(b => b.onclick = () => { const ev = Cal.events.find(x => x.id === b.dataset.copy); ev && copyText(eventText(ev)); });
  $$("[data-detail]", root).forEach(b => b.onclick = () => { const el = root.querySelector(`details[data-id="${CSS.escape(b.dataset.detail)}"]`); if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "center" }); } else openEventSheet(b.dataset.detail); });
  $("#srcBtn").onclick = openSourceSheet;
  const mb = $("#moreBtn", root); if (mb) mb.onclick = () => { const y = scrollY; Cal.weeks += 8; renderTermine(); scrollTo(0, y); };
  if (next && next.start > Date.now()) tick(next.start);
}
function eventCard(e) {

const URL_RE = /https?:\/\/\S+/;
function spLink(e) { const m = URL_RE.exec(e.desc || ""); return m && /spielerplus|teamplus/i.test(m[0]) ? m[0] : ""; }
function descHTML(e) { const t = (e.desc || "").replace(spLink(e) || "\u0000", "").trim(); return t ? `<p class="desc">${esc(t)}</p>` : ""; }
function openEventSheet(id) { const e = Cal.events.find(x => x.id === id); if (!e) return; openSheet(`<h2 style="font-size:26px;margin:4px 40px 10px 0">${esc(e.title)}</h2>${eventBody(e)}`); $$("#sheetInner [data-copy]").forEach(b => b.onclick = () => copyText(eventText(e))); }
function tick(target) {
  const cd = $("#cd"); if (!cd) return;
  const b = $$("b", cd);
  const upd = () => {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    if (s <= 0) { clearInterval(Cal.timer); renderTermine(); return; }
    const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
    b[0].textContent = d; b[1].textContent = String(h).padStart(2, "0"); b[2].textContent = String(m).padStart(2, "0"); b[3].textContent = String(s).padStart(2, "0");
  };
  upd(); Cal.timer = setInterval(upd, 1000);
}

function demoICS() {
  const p = n => String(n).padStart(2, "0");
  const at = (dayOffset, h, m) => { const w = wallParts(Date.now() + dayOffset * 864e5); return `${w.y}${p(w.m)}${p(w.d)}T${p(h)}${p(m)}00`; };
  const nextDow = dow => { const w = new Date(Date.now()).getUTCDay(); return (dow - w + 7) % 7 || 7; };
  const ev = (uid, s, e, sum, loc, desc, extra = "") => `BEGIN:VEVENT\r\nUID:${uid}\r\nDTSTART;TZID=Europe/Berlin:${s}\r\nDTEND;TZID=Europe/Berlin:${e}\r\nSUMMARY:${sum}\r\nLOCATION:${loc}\r\nDESCRIPTION:${desc}\r\n${extra}END:VEVENT\r\n`;
  const tu = nextDow(2) - 7, th = nextDow(4) - 7, we = nextDow(3) - 7;
  return "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Demo//DE\r\n" +
    ev("demo-tr", at(tu, 19, 0), at(tu, 20, 45), "Training Mixed", "Beispiel-Sportplatz\\, München", "Beispiel: Kontakttraining + Lineouts. Neue willkommen!", "RRULE:FREQ=WEEKLY;BYDAY=TU,TH\r\n") +
    ev("demo-fl", at(we, 19, 0), at(we, 20, 30), "Training FLINTA*", "Beispiel-Sportplatz\\, München", "Beispiel: Basics\\, Passen\\, Tackle-Technik.", "RRULE:FREQ=WEEKLY;BYDAY=WE\r\n") +
    ev("demo-liga", at(nextDow(6) + 7, 14, 0), at(nextDow(6) + 7, 16, 0), "Ligaspiel Mixed: Munich Monks vs. Beispiel RFC", "Beispiel-Stadion\\, München", "Treffpunkt 12:30. Bitte Mouthguard nicht vergessen.") +
    ev("demo-cup", at(nextDow(6) + 21, 9, 0), at(nextDow(6) + 21, 18, 0), "IGR Beispiel-Turnier (Mixed + FLINTA*)", "Beispielstadt", "Beispiel-Turnier – kein echter Termin.") +
    ev("demo-soc", at(nextDow(5), 20, 0), at(nextDow(5), 23, 30), "Monks Social: Stammtisch", "Beispiel-Bar\\, München", "Einfach vorbeikommen – auch ohne Rugby-Erfahrung!") +
    "END:VCALENDAR\r\n";
}


/* ======================================================================
   GOOGLE KALENDER (Schnappschuss + Live für Personen mit Zugriff)
   ====================================================================== */
function gEventsToEvents(list) {
  const out = [];
  for (const g of list) {
    // akzeptiert kompakte Schnappschuss-Einträge {t,s,e,l,d,x} und rohe Google-Events
    const title = (g.t ?? g.summary ?? "Termin").trim();
    const s = g.s ?? (g.start && (g.start.dateTime || g.start.date));
    const e = g.e ?? (g.end && (g.end.dateTime || g.end.date));
    if (!s) continue;
    const allDay = /^\d{4}-\d{2}-\d{2}$/.test(s);
    const toT = v => allDay ? zonedToUtc({ y: +v.slice(0, 4), m: +v.slice(5, 7), d: +v.slice(8, 10) }, TZ) : Date.parse(v);
    const start = toT(s), end = e ? toT(e) : start + (allDay ? 864e5 : 0);
    const raw = { summary: title, description: g.d ?? g.description ?? "", location: g.l ?? g.location ?? "", uid: g.id || title + s,
      status: g.x || g.status === "cancelled" ? "CANCELLED" : "", dtstart: { allDay } };
    out.push(makeEvent(raw, start, Math.max(0, end - start)));
  }
  return out.sort((a, b) => a.start - b.start);
}
function useSnapshot() {
  Cal.events = gEventsToEvents(SNAPSHOT.events); Cal.source = "snapshot"; Cal.at = Date.parse(SNAPSHOT.stand) || null; renderTermine();
}
async function getMcp() { try { return window.claude && window.claude.use ? await window.claude.use("mcp") : null; } catch (e) { return null; } }
async function googleRefresh(interactive) {
  const mcp = await getMcp();
  if (!mcp) { if (interactive) showGoogleMsg("Die Google-Verbindung ist in dieser Ansicht nicht verfügbar. Öffne die App auf claude.ai, dann klappt's."); return false; }
  if (interactive) showGoogleMsg("Lade aus Google Kalender …");
  const w = wallParts(Date.now()), p2 = n => String(n).padStart(2, "0");
  const end = wallParts(Date.now() + CONFIG.HORIZON_DAYS * 864e5);
  const base = { calendarId: CONFIG.GOOGLE_CALENDAR_ID, startTime: `${w.y}-${p2(w.m)}-${p2(w.d)}T00:00:00`, endTime: `${end.y}-${p2(end.m)}-${p2(end.d)}T00:00:00`, orderBy: "startTime", pageSize: 250 };
  try {
    let all = [], token = null, storedAt = null;
    for (let i = 0; i < 5; i++) {
      const res = await mcp.callTool(CONFIG.GOOGLE_CONNECTOR, "list_events", token ? { ...base, pageToken: token } : base,
        interactive ? { cache: { refresh: true, staleTime: 6e5, gcTime: 6048e5 } } : { cache: { staleTime: 6e5, gcTime: 6048e5 } });
      let p = res.payload; if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = {}; } }
      all = all.concat((p && p.events) || []);
      if (res.cache && !storedAt) storedAt = res.cache.storedAt;
      token = p && p.nextPageToken; if (!token) break;
    }
    store.set("gcal_ok", 1);
    Cal.events = gEventsToEvents(all); Cal.source = "google"; Cal.at = storedAt || Date.now();
    closeSheet(); renderTermine(); if (interactive) toast(`${Cal.events.length} Termine geladen ✓`);
    return true;
  } catch (err) {
    const c = err && err.code, S = CONFIG.GOOGLE_CONNECTOR;
    const msg = {
      server_not_connected: `${S} ist für dich nicht verbunden. Füge ihn auf claude.ai unter Einstellungen → Connectors hinzu.`,
      selection_required: `Du hast mehrere ${S}-Verbindungen – bitte in claude.ai eine auswählen.`,
      needs_reauth: `${S} muss neu verbunden werden (claude.ai → Einstellungen → Connectors).`,
      approval_required: "Der Zugriff wurde nicht erlaubt. Tippe nochmal und bestätige die Anfrage.",
      not_in_manifest: "Der Zugriff auf Google Kalender ist für diese Seite ausgeschaltet.",
      blocked_by_policy: "Google Kalender ist für dein Konto gesperrt.",
      tool_error: "Der Kalender „TeamPlus - Munich Monks“ ist für dich nicht abrufbar – nur wer ihn in Google abonniert hat, kann live laden.",
      server_unavailable: "Google Kalender antwortet gerade nicht. Versuch's gleich nochmal.",
    }[c] || "Das hat nicht geklappt. Versuch's später nochmal.";
    if (["server_not_connected", "needs_reauth", "not_in_manifest", "blocked_by_policy", "tool_error"].includes(c)) store.del("gcal_ok");
    if (interactive) showGoogleMsg(msg, true);
    return false;
  }
}
function showGoogleMsg(t, isErr) { const el = $("#gMsg"); if (el) { el.hidden = false; el.textContent = t; el.style.color = isErr ? "#ff8a80" : "var(--mut)"; } else if (isErr) toast(t); }

const MARK_S = "/*FOTOS_" + "START*/", MARK_E = "/*FOTOS_" + "END*/";
/* Cloudflare: Fotos liegen im KV-Speicher (functions/api/photos). Bearbeiten über ?admin in der URL. */
const PHOTO_API = "/api/photos";
(async () => {
  try {
    const r = await fetch(PHOTO_API, { cache: "no-store" });
    if (r.ok) { const remote = await r.json(); for (const [k, v] of Object.entries(remote)) { if (v) FOTOS[k] = v; else delete FOTOS[k]; } }
  } catch (e) {}
  if (new URLSearchParams(location.search).has("admin") || store.get("admin_token")) Team.editor = true;
  if (!$("#tab-team").hidden) renderTeam();
})();
async function ownSource() {
  for (const u of ["index.html", location.pathname]) {
    try { const r = await fetch(u, { cache: "no-store" }); if (r.ok) { const t = await r.text(); if (/^\s*<!DOCTYPE html>/i.test(t) && t.includes(MARK_S)) return t; } } catch (e) {}
  }
  return BOOT_HTML;
}
function openPhotoSheet(p) {
  const cur = FOTOS[p.name] || "";
  openSheet(`<h2 style="font-size:26px;margin:4px 40px 4px 0">Foto für ${esc(p.name)}</h2>
    <p class="mut">Das Foto wird verkleinert gespeichert – alle, die die App öffnen, sehen es.</p>
    <div class="photoprev"><canvas id="phCan" width="256" height="256"></canvas>${cur ? "" : '<div id="phEmpty">Noch kein Foto</div>'}</div>
    <div class="btnrow" style="justify-content:center;margin:12px 0">
      <label class="btn">${ICON.upload}Foto wählen<input type="file" id="phFile" accept="image/*" class="sr"></label>
    </div>
    <div id="phPos" hidden><label class="mut" for="phRange">Ausschnitt verschieben</label><input type="range" id="phRange" min="0" max="100" value="35" style="width:100%"></div>
    <div class="btnrow" style="margin-top:10px">
      <button class="btn primary" id="phSave" disabled>Für alle speichern</button>
      ${cur ? '<button class="btn ghost" id="phDel">Foto entfernen</button>' : ""}
    </div>
    <p id="phMsg" class="mut" style="margin-top:10px"></p>`);
  const can = $("#phCan"), ctx = can.getContext("2d"), S = $("#sheetInner");
  let img = null;
  if (cur) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, 256, 256); i.src = cur; }
  const draw = () => {
    if (!img) return;
    const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h), pos = $("#phRange").value / 100;
    const sx = w > h ? (w - side) * pos : 0, sy = h > w ? (h - side) * pos : 0;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 256, 256); ctx.drawImage(img, sx, sy, side, side, 0, 0, 256, 256);
  };
  $("#phFile", S).onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const url = URL.createObjectURL(file), i = new Image();
    i.onload = () => { img = i; const em = $("#phEmpty"); em && em.remove(); $("#phPos").hidden = i.naturalWidth === i.naturalHeight; $("#phRange").value = i.naturalHeight > i.naturalWidth ? 25 : 50; draw(); $("#phSave").disabled = false; };
    i.onerror = () => { $("#phMsg").textContent = "Dieses Bildformat geht leider nicht – bitte JPG oder PNG nehmen."; };
    i.src = url;
  };
  $("#phRange", S).oninput = draw;
  $("#phSave", S).onclick = () => savePhoto(p.name, can.toDataURL("image/jpeg", 0.82));
  const del = $("#phDel", S); if (del) del.onclick = () => savePhoto(p.name, null);
}
async function savePhoto(name, dataUrl) {
  const msg = $("#phMsg"), btns = $$("#sheetInner .btn");
  let token = store.get("admin_token");
  if (!token) { token = prompt("Admin-Passwort zum Speichern der Fotos:"); if (!token) return; }
  btns.forEach(b => b.disabled = true);
  msg.textContent = "Speichere …";
  try {
    const r = await fetch(PHOTO_API + "/" + encodeURIComponent(name), {
      method: dataUrl ? "PUT" : "DELETE",
      headers: { "Content-Type": "text/plain", "X-Admin-Token": token },
      body: dataUrl || undefined,
    });
    if (r.status === 401) { store.del("admin_token"); throw { code: "auth" }; }
    if (!r.ok) throw { code: "http", status: r.status };
    store.set("admin_token", token);
    if (dataUrl) FOTOS[name] = dataUrl; else delete FOTOS[name];
    msg.textContent = "Gespeichert ✓";
    setTimeout(() => { closeSheet(); renderTeam(); }, 500);
  } catch (err) {
    msg.textContent = err && err.code === "auth" ? "Falsches Passwort." : "Speichern hat nicht geklappt. Versuch's gleich nochmal.";
    btns.forEach(b => b.disabled = false);
  }
}

  $$("[data-mode]", root).forEach(b => b.onclick = () => { CallsUI.mode = b.dataset.mode; CallsUI.anim && CallsUI.anim.stop(); renderCalls(); });
  CallsUI.mode === "lernen" ? renderLearn(cats) : renderQuiz();
}
function renderLearn(cats) {
  const body = $("#callsBody");
  const list = CALLS.filter(c => c.kategorie === CallsUI.cat);
  if (!list.find(c => c.id === CallsUI.id)) CallsUI.id = list[0] && list[0].id;
  const c = CALLS.find(x => x.id === CallsUI.id);
  body.innerHTML = `
    ${cats.length > 1 ? `<div class="chips">${cats.map(k => `<button class="chip" data-cat="${esc(k)}" aria-pressed="${k === CallsUI.cat}">${esc(k)}</button>`).join("")}</div>` : ""}
    <details class="basics"><summary>🤓 ${esc(CallsUI.cat)}-Basics für Neue</summary>
      <p><b>Lineout</b> (Gasse): Spielfortsetzung, wenn der Ball im Aus war. Beide Teams stellen sich in zwei Reihen auf, der <b>Hooker</b> wirft den Ball gerade dazwischen.</p>
      <p><b>Jumper</b> springen hoch und fangen. <b>Lifter</b> heben sie an – vorne und hinten – und setzen sie sicher wieder ab.</p>
      <p>Ein <b>Pod</b> ist so ein Dreier-Team aus Front-Lifter, Jumper und Back-Lifter. Wir haben zwei: Pod 1 (L1, J1, L2) vorne und Pod 2 (L3, J2, L4) dahinter.</p>
      <p>Mit dem <b>Call</b> sagen wir an, wohin der Ball fliegt und was danach passiert – die Gegner*innen sollen's natürlich nicht wissen.</p>
    </details>
    <div class="callpick">${list.map(x => `<button data-call="${x.id}" aria-pressed="${x.id === CallsUI.id}"><b>${esc(x.name)}</b><span>${esc(x.kurz)}</span></button>`).join("")}</div>
    ${c ? `<div class="card callcard">
      <div class="callhead"><div class="callname">${esc(c.name)}</div><div class="mut">${esc(c.kurz)}</div></div>
      <svg class="anim" viewBox="8 58 296 222" id="animSvg" role="img" aria-label="Animation des Calls ${esc(c.name)}"></svg>
      ${legend}
      <div class="caption" id="cap"></div>
      <div class="ctrls">
        <button class="cbtn" id="cPrev" aria-label="Schritt zurück">◀</button>
        <button class="cbtn main" id="cPlay" aria-label="Abspielen">${PLAY_I}</button>
        <button class="cbtn" id="cNext" aria-label="Nächster Schritt">▶</button>
        <button class="cbtn" id="cReplay" aria-label="Von vorn">${REPLAY_I}</button>
      </div>
      <div class="dots" id="dots">${c.schritte.map((_, i) => `<i data-d="${i + 1}"></i>`).join("")}</div>
      <p class="expl">${esc(c.erklaerung)}</p>
      <h4>Wer macht was?</h4>
      <div class="who">${c.wer.map(([r, t]) => `<div><b>${esc(r)}</b><span>${esc(t)}</span></div>`).join("")}</div>
      <h4>Darauf achten</h4><ul class="mini check">${c.achtung.map(a => `<li>${esc(a)}</li>`).join("")}</ul>
    </div>` : ""}`;
  $$("[data-cat]", body).forEach(b => b.onclick = () => { CallsUI.cat = b.dataset.cat; CallsUI.id = null; renderCalls(); });
  $$("[data-call]", body).forEach(b => b.onclick = () => { CallsUI.id = b.dataset.call; CallsUI.anim && CallsUI.anim.stop(); renderLearn(cats); setTimeout(() => CallsUI.anim.play(true), 150); });
  if (!c) return;
  const cap = $("#cap"), dots = $$("#dots i");
  const anim = CallsUI.anim = new CallAnim($("#animSvg"), c, {
    onStep: (k, running) => {
      cap.innerHTML = k === 0 ? `<span class="sn">Start</span>Aufstellung: Hooker an der Seitenlinie, unser Lineout gegenüber den Gegner*innen.` : `<span class="sn">${k}/${c.schritte.length}</span>${esc(c.schritte[k - 1].text)}`;
      dots.forEach((d, i) => { d.classList.toggle("on", i < k); d.classList.toggle("cur", i === k - 1); });
      $("#cPlay").innerHTML = anim && anim.playing ? PAUSE_I : PLAY_I;
    }
  });
  anim.onStep(0);
  $("#cPlay").onclick = () => anim.playing ? anim.stop() : anim.play(false);
  $("#cReplay").onclick = () => anim.play(true);
  $("#cNext").onclick = () => anim.next();
  $("#cPrev").onclick = () => anim.prev();
  dots.forEach(d => d.onclick = () => { anim.stop(); anim.k = +d.dataset.d; anim.draw(anim.k, 1); anim.onStep(anim.k); });
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderQuiz() {
  const body = $("#callsBody"), Q = CallsUI.quiz;
  const pool = CALLS;
  if (!Q.cur || Q.answered) { let p; do { p = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && Q.cur && p.id === Q.cur.id); Q.cur = p; Q.answered = false; }
  const c = Q.cur;
  const opts = shuffle(CALLS.filter(x => x.kategorie === c.kategorie));
  body.innerHTML = `
    <div class="quizbar"><span>Punkte <b>${Q.score}/${Q.total}</b></span><span>Serie <b>${Q.streak}${Q.streak >= 3 ? " 🔥" : ""}</b></span></div>
    <div class="card callcard">
      <div class="callhead"><div class="callname">Welcher Call ist das?</div><div class="mut">Schau genau hin, wohin der Ball fliegt – und was danach passiert.</div></div>
      <svg class="anim" viewBox="8 58 296 222" id="animSvg" role="img" aria-label="Quiz-Animation"></svg>
      ${legend}
      <div class="ctrls"><button class="cbtn main" id="cReplay" aria-label="Nochmal ansehen">${REPLAY_I}</button></div>
      <div class="answers">${opts.map(o => `<button class="ans" data-ans="${o.id}">${esc(o.name)}</button>`).join("")}</div>
      <div id="qfb" class="qfb" hidden></div>
    </div>`;
  const anim = CallsUI.anim = new CallAnim($("#animSvg"), c, { hideText: true });
  anim.speed = 1;
  setTimeout(() => anim.play(true), 350);
  $("#cReplay").onclick = () => anim.play(true);
  $$("[data-ans]", body).forEach(b => b.onclick = () => {
    if (Q.answered) return; Q.answered = true; Q.total++;
    const ok = b.dataset.ans === c.id;
    if (ok) { Q.score++; Q.streak++; } else Q.streak = 0;
    $$("[data-ans]", body).forEach(x => { x.disabled = true; if (x.dataset.ans === c.id) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    const fb = $("#qfb"); fb.hidden = false;
    fb.innerHTML = `<p><b>${ok ? ["Stark! 💪", "Sitzt! 🎯", "Genau so! 🏉"][Q.total % 3] : "Knapp daneben – das war " + esc(c.name) + "."}</b> ${esc(c.kurz)}.</p>
      <div class="btnrow"><button class="btn primary" id="qNext">Nächste Frage →</button><button class="btn" id="qLearn">Call ansehen</button></div>`;
    $(".quizbar b").textContent = `${Q.score}/${Q.total}`;
    $$(".quizbar b")[1].textContent = Q.streak + (Q.streak >= 3 ? " 🔥" : "");
    $("#qNext").onclick = () => { anim.stop(); renderQuiz(); };
    $("#qLearn").onclick = () => { anim.stop(); CallsUI.mode = "lernen"; CallsUI.cat = c.kategorie; CallsUI.id = c.id; renderCalls(); };
  });
}
onShow.calls = () => { if (!$("#callsBody")) renderCalls(); };
onShow.positionen = () => { if (!$("#field") && !$(".field")) renderPositionen(); };
onShow.team = () => { if (!$(".people")) renderTeam(); };

showTab(location.hash.slice(1) || "termine");
loadCalendar();
